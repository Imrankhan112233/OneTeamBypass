plugins {
    id 'com.android.application'
}
android {
    namespace 'com.deephat.oneteambypass'
    compileSdk 34
    defaultConfig {
        applicationId "com.deephat.oneteambypass"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

