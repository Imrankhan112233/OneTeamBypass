name: Build LSPosed APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create Project Structure and Files
      run: |
        # ... (your existing file creation commands here) ...
        
        # IMPORTANT: Add module.json if using LSPosed
        mkdir -p app/src/main/assets
        cat << 'EOF' > app/src/main/assets/module.json
        {
          "name": "OneTeam Bypass",
          "version": 1,
          "versionName": "1.0",
          "author": "DeepHat",
          "entry": "com.deephat.oneteambypass.MainActivity",
          "minAPI": 24,
          "required": true,
          "scopes": ["com.kpitb.oneteam"]
        }
        EOF

    - name: Generate Gradle Wrapper (if not present)
      run: |
        ./gradlew wrapper --gradle-version 8.5 --distribution-type all || echo "Wrapper generation failed or not needed"

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneTeamBypass-APK
        path: app/build/outputs/apk/debug/app-debug.apk
